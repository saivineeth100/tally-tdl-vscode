name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Download Cache and Samples
        run: node scripts/download-cache.js
        env:
          META_CACHE_URL_7_0: ${{ secrets.META_CACHE_URL_7_0 }}
          SAMPLES_URL_7_0: ${{ secrets.SAMPLES_URL_7_0 }}
      - run: npm run compile
      - run: npm test
        env:
          TDL_SAMPLES_DIR: samples/7.0

